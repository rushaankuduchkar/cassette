<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tactile Cassette Synthesizer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #2b2b2b; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;}
    canvas { display: block; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <script>
    let audioStarted = false;

    // Dimensions & Math
    let cw, ch, scaleF; 
    let layout = {}; // Stores coordinates for every 3D button

    // Interaction states
    let activeZone = null; 
    let angleL = 0, angleR = 0;
    let speedL = 0, speedR = 0;
    let impactScale = 1.0;

    // Audio Elements
    let saxOsc, saxFilter, knobOsc, polySynth;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      calculateDimensions();
      rectMode(CENTER);
      angleMode(RADIANS);
      
      // --- AUDIO SETUP ---
      saxOsc = new p5.Oscillator('sawtooth');
      saxFilter = new p5.LowPass();
      saxFilter.freq(1200);
      saxOsc.disconnect();
      saxOsc.connect(saxFilter);
      saxOsc.start();
      saxOsc.amp(0);
      
      knobOsc = new p5.Oscillator('sine');
      knobOsc.start();
      knobOsc.amp(0);

      polySynth = new p5.PolySynth();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      calculateDimensions();
    }

    // Calculates coordinates for every button and hitbox
    function calculateDimensions() {
      cw = min(width * 0.9, 850);
      ch = cw * 0.625;
      scaleF = cw / 800; 
      
      let rimW = ch * 0.12;
      
      // Outer Drum Pads (Rims)
      layout.rimTop = {x: 0, y: -ch/2 + rimW/2, w: cw, h: rimW};
      layout.rimBottom = {x: 0, y: ch/2 - rimW/2, w: cw, h: rimW};
      layout.rimLeft = {x: -cw/2 + rimW/2, y: 0, w: rimW, h: ch - 2*rimW};
      layout.rimRight = {x: cw/2 - rimW/2, y: 0, w: rimW, h: ch - 2*rimW};

      // Label & Melodic Stripe Pads
      let labelW = cw * 0.75;
      let labelH = ch * 0.52;
      let labelY = -ch * 0.12;
      let lblH = labelH * 0.35;
      
      layout.label = {x: 0, y: labelY - labelH/2 + lblH/2 + 4*scaleF, w: labelW - 16*scaleF, h: lblH};

      let strH = (labelH * 0.6) / 4 - 3*scaleF;
      let startY = layout.label.y + lblH/2 + strH/2 + 6*scaleF;
      
      layout.stripe1 = {x: 0, y: startY, w: labelW - 16*scaleF, h: strH};
      layout.stripe2 = {x: 0, y: startY + strH + 3*scaleF, w: labelW - 16*scaleF, h: strH};
      layout.stripe3 = {x: 0, y: startY + (strH + 3*scaleF)*2, w: labelW - 16*scaleF, h: strH};
      layout.stripe4 = {x: 0, y: startY + (strH + 3*scaleF)*3, w: labelW - 16*scaleF, h: strH};

      // Center Controls
      layout.window = {x: 0, y: ch*0.06, w: cw*0.48, h: ch*0.25};
      layout.spoolL = {x: -cw*0.13, y: layout.window.y, d: ch*0.22};
      layout.spoolR = {x: cw*0.13, y: layout.window.y, d: ch*0.22};

      // Bottom Area Pads
      let indentW_top = cw * 0.45, indentW_bot = cw * 0.55;
      let indentH = ch * 0.18, indentY = ch/2 - rimW/2; 
      layout.indent = {
        y: indentY, w: indentW_bot, h: indentH, // for hitbox
        verts: [
          {x: -indentW_top/2, y: indentY - indentH/2},
          {x: indentW_top/2,  y: indentY - indentH/2},
          {x: indentW_bot/2,  y: indentY + indentH/2},
          {x: -indentW_bot/2, y: indentY + indentH/2}
        ]
      };

      layout.holeL = {x: -cw * 0.25, y: indentY, d: 24*scaleF};
      layout.holeR = {x: cw * 0.25, y: indentY, d: 24*scaleF};

      layout.screwTL = {x: layout.rimLeft.x, y: layout.rimTop.y, d: 20*scaleF};
      layout.screwTR = {x: layout.rimRight.x, y: layout.rimTop.y, d: 20*scaleF};
      layout.screwBL = {x: layout.rimLeft.x, y: layout.rimBottom.y, d: 20*scaleF};
      layout.screwBR = {x: layout.rimRight.x, y: layout.rimBottom.y, d: 20*scaleF};
    }

    function draw() {
      background('#2b2b2b');

      if (!audioStarted) {
        fill(200); textAlign(CENTER, CENTER); textSize(24 * scaleF);
        text("Tap anywhere to activate the Groovebox", width/2, height/5);
      }

      translate(width/2, height/2);

      // Global bounce impact
      scale(impactScale);
      impactScale = lerp(impactScale, 1.0, 0.15);

      // Continuous Rotary Modulation
      if (activeZone === 'spoolL') {
        speedL = 0.15;
        saxOsc.freq(map(mouseY, 0, height, 800, 150, true), 0.1);
      }
      if (activeZone === 'spoolR') {
        speedR = 0.15;
        knobOsc.freq(map(mouseX, 0, width, 200, 1200, true), 0.1);
        knobOsc.amp(map(mouseY, 0, height, 0.8, 0, true), 0.1);
      }

      angleL += speedL; angleR += speedR;
      if (activeZone !== 'spoolL') speedL *= 0.92;
      if (activeZone !== 'spoolR') speedR *= 0.92;

      drawCassette();
    }

    // --- 3D BUTTON DRAWING FACTORIES ---

    // Draw a tactile rectangular pad
    function drawPad(z, col, obj, r=0) {
      let isPressed = (activeZone === z);
      let offset = isPressed ? 0 : 5 * scaleF;
      
      noStroke();
      fill(lerpColor(color(col), color(0), 0.4)); // Drop shadow/base
      rect(obj.x, obj.y, obj.w, obj.h, r);
      
      fill(col); // Top surface
      rect(obj.x - offset, obj.y - offset, obj.w, obj.h, r);
    }

    // Draw a tactile circular pad
    function drawRoundPad(z, col, obj, isScrew=false) {
      let isPressed = (activeZone === z);
      let offset = isPressed ? 0 : 4 * scaleF;
      
      noStroke();
      fill(lerpColor(color(col), color(0), 0.4));
      circle(obj.x, obj.y, obj.d);
      
      fill(col);
      circle(obj.x - offset, obj.y - offset, obj.d);
      
      if (isScrew) {
         stroke('#222'); strokeWeight(2 * scaleF);
         let h = obj.d/4;
         line(obj.x - offset - h, obj.y - offset - h, obj.x - offset + h, obj.y - offset + h);
         line(obj.x - offset - h, obj.y - offset + h, obj.x - offset + h, obj.y - offset - h);
      }
    }

    // Draw interactive 3D Spools
    function drawSpool(z, obj, rotAngle) {
      let isPressed = (activeZone === z);
      let offset = isPressed ? 0 : 5 * scaleF;
      
      push(); translate(obj.x, obj.y); 
      
      noStroke(); fill(0, 100); 
      circle(3*scaleF, 3*scaleF, obj.d); // Shadow
      
      translate(-offset, -offset); rotate(rotAngle);
      
      fill('#f4f4f4'); circle(0, 0, obj.d * 0.95);
      fill('#c8c8c8'); circle(0, 0, obj.d * 0.55);
      fill(40);
      for (let i = 0; i < 6; i++) {
        push(); rotate((TWO_PI / 6) * i); rect(0, -obj.d*0.32, obj.d*0.12, obj.d*0.2); pop();
      }
      fill('#1a1a1a'); circle(0, 0, obj.d * 0.25);
      pop();
    }

    // Draw custom polygon pad (bottom indent)
    function drawPolyPad(z, col, obj) {
      let isPressed = (activeZone === z);
      let offset = isPressed ? 0 : 4 * scaleF;
      
      noStroke(); fill(lerpColor(color(col), color(0), 0.4));
      beginShape(); for(let v of obj.verts) vertex(v.x, v.y); endShape(CLOSE);
      
      fill(col);
      beginShape(); for(let v of obj.verts) vertex(v.x - offset, v.y - offset); endShape(CLOSE);
    }

    // Assemble the Groovebox
    function drawCassette() {
      fill('#1a1a1a'); rect(0, 0, cw, ch, 15 * scaleF); // Base shell

      drawPad('rimTop', '#383838', layout.rimTop, 8*scaleF);
      drawPad('rimBottom', '#383838', layout.rimBottom, 8*scaleF);
      drawPad('rimLeft', '#383838', layout.rimLeft, 0);
      drawPad('rimRight', '#383838', layout.rimRight, 0);

      fill('#0a0a0a'); rect(0, -ch*0.12, cw*0.75, ch*0.52, 8*scaleF); // Label Recess

      drawPad('label', '#e6e0d4', layout.label, 4*scaleF);
      drawPad('stripe1', '#e78c45', layout.stripe1, 3*scaleF);
      drawPad('stripe2', '#75b9be', layout.stripe2, 3*scaleF);
      drawPad('stripe3', '#e3b156', layout.stripe3, 3*scaleF);
      drawPad('stripe4', '#d6443c', layout.stripe4, 3*scaleF);

      drawPad('window', '#111', layout.window, 8*scaleF);
      drawSpool('spoolL', layout.spoolL, angleL);
      drawSpool('spoolR', layout.spoolR, angleR);

      drawPolyPad('indent', '#252525', layout.indent);

      drawRoundPad('holeL', '#181818', layout.holeL);
      drawRoundPad('holeR', '#181818', layout.holeR);
      drawRoundPad('screwTL', '#5c5c5c', layout.screwTL, true);
      drawRoundPad('screwTR', '#5c5c5c', layout.screwTR, true);
      drawRoundPad('screwBL', '#5c5c5c', layout.screwBL, true);
      drawRoundPad('screwBR', '#5c5c5c', layout.screwBR, true);
    }

    // --- INTERACTION LOGIC ---

    function inRect(mx, my, rx, ry, rw, rh) {
      return mx > rx - rw/2 && mx < rx + rw/2 && my > ry - rh/2 && my < ry + rh/2;
    }

    function getHitZone(mx, my) {
      // 1. Check Circles
      let circles = ['spoolL', 'spoolR', 'holeL', 'holeR', 'screwTL', 'screwTR', 'screwBL', 'screwBR'];
      for (let c of circles) {
        if (dist(mx, my, layout[c].x, layout[c].y) < layout[c].d / 2) return c;
      }
      // 2. Check Indent Box
      if (inRect(mx, my, 0, layout.indent.y, layout.indent.w, layout.indent.h)) return 'indent';
      // 3. Check Rectangular Pads
      let rects = ['window', 'stripe1', 'stripe2', 'stripe3', 'stripe4', 'label', 'rimTop', 'rimBottom', 'rimLeft', 'rimRight'];
      for (let r of rects) {
        if (inRect(mx, my, layout[r].x, layout[r].y, layout[r].w, layout[r].h)) return r;
      }
      return null;
    }

    function mousePressed() {
      if (!audioStarted) { userStartAudio(); audioStarted = true; }

      activeZone = getHitZone(mouseX - width/2, mouseY - height/2);

      if (activeZone === 'spoolL') saxOsc.amp(0.6, 0.1);
      else if (activeZone === 'spoolR') knobOsc.amp(0.5, 0.1);
      else if (activeZone) {
        impactScale = 1.02; // Global physical bump
        triggerOneShot(activeZone);
      }
    }

    function mouseReleased() {
      activeZone = null; // Unpress everything visually
      saxOsc.amp(0, 0.2); 
      knobOsc.amp(0, 0.2);
    }

    // --- AUDIO GENERATORS ---
    function triggerOneShot(zone) {
      switch(zone) {
        case 'stripe1': polySynth.play('C4', 0.8, 0, 0.5); break;
        case 'stripe2': polySynth.play('E4', 0.8, 0, 0.5); break;
        case 'stripe3': polySynth.play('G4', 0.8, 0, 0.5); break;
        case 'stripe4': polySynth.play('C5', 0.8, 0, 0.5); break;
        case 'label':   polySynth.play('C4',0.5,0,1); polySynth.play('G4',0.5,0,1); polySynth.play('E5',0.5,0,1); break;
        case 'screwTL': playBeep(1200); break;
        case 'screwTR': playBeep(1400); break;
        case 'screwBL': playBeep(800); break;
        case 'screwBR': playBeep(900); break;
        case 'holeL':   playZap(800, 100); break;
        case 'holeR':   playZap(1200, 200); break;
        case 'window':  playScratch(); break;
        case 'indent':  playSub(); break;
        case 'rimTop':  playHihat(); break;
        case 'rimBottom': playKick(); break;
        case 'rimLeft': playSnare(); break;
        case 'rimRight':playTom(200); break;
      }
    }

    function playBeep(f) { let o = new p5.Oscillator('square'); let e = new p5.Envelope(0.01,0.1,0,0); o.freq(f); o.start(); e.play(o); setTimeout(()=>o.stop(),200); }
    function playZap(s, eF) { let o = new p5.Oscillator('sawtooth'); let e = new p5.Envelope(0.01,0.3,0,0); o.freq(s); o.freq(eF,0.2); o.start(); e.play(o); setTimeout(()=>o.stop(),300); }
    function playKick() { let o = new p5.Oscillator('sine'); let e = new p5.Envelope(0.01,0.4,0,0); o.freq(150); o.freq(20,0.2); o.start(); e.play(o); setTimeout(()=>o.stop(),500); }
    function playSnare() { let n = new p5.Noise('white'); let e = new p5.Envelope(0.01,0.2,0,0); n.start(); e.play(n); setTimeout(()=>n.stop(),300); }
    function playHihat() { let n = new p5.Noise('white'); let f = new p5.BandPass(); f.freq(5000); n.disconnect(); n.connect(f); let e = new p5.Envelope(0.01,0.05,0,0); n.start(); e.play(n); setTimeout(()=>n.stop(),100); }
    function playTom(f) { let o = new p5.Oscillator('triangle'); let e = new p5.Envelope(0.01,0.3,0,0); o.freq(f); o.freq(f/2,0.2); o.start(); e.play(o); setTimeout(()=>o.stop(),400); }
    function playSub() { let o = new p5.Oscillator('sine'); let e = new p5.Envelope(0.05,1.0,0,0); o.freq(50); o.start(); e.play(o); setTimeout(()=>o.stop(),1000); }
    function playScratch() { let n = new p5.Noise('pink'); let e = new p5.Envelope(0.05,0.2,0.1,0); n.start(); e.play(n); setTimeout(()=>n.stop(),300); }
  </script>
</body>
</html>
